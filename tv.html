<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ANTOSHKAALLEN TV 🔞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=JetBrains+Mono:wght@700;800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070607; --ink: #f4f1ea; --dim: #8e8780; --red: #ff1f3a; --blood: #b0081d;
    --head: 'Unbounded', 'Arial Black', sans-serif;
    --mono: 'JetBrains Mono', 'Menlo', monospace;
    --sans: 'Manrope', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { cursor: none; }
  body.mouse { cursor: default; }

  /* сцена 1920×1080, масштабируется под любой экран 16:9 (Full HD, 4K) */
  #stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform-origin: 0 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--sans);
  }

  /* фон: медленные красные пятна + строки развёртки + виньетка */
  .bg, .bg::before, .bg::after { position: absolute; inset: 0; pointer-events: none; }
  .bg { overflow: hidden; }
  .bg i { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; filter: none;
    background: radial-gradient(closest-side, rgba(255, 31, 58, .20), rgba(255, 31, 58, 0) 70%); will-change: transform; }
  .bg i:nth-child(1) { left: -500px; top: -600px; animation: drift1 38s ease-in-out infinite alternate; }
  .bg i:nth-child(2) { right: -600px; bottom: -700px; animation: drift2 46s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(380px, 260px) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-320px, -220px) scale(1.1); } }
  .bg::before { content: ''; background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px); }
  .bg::after { content: ''; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.75) 100%); }

  /* верхняя плашка эфира */
  .top { position: absolute; left: 64px; right: 64px; top: 34px; height: 64px; display: flex; align-items: center; gap: 26px; z-index: 5; }
  .live { display: flex; align-items: center; gap: 12px; background: var(--red); color: #fff; font: 800 26px/1 var(--head);
    padding: 12px 20px 12px 18px; border-radius: 6px; letter-spacing: .08em; box-shadow: 0 0 30px rgba(255,31,58,.5); }
  .live b { width: 14px; height: 14px; border-radius: 50%; background: #fff; animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .logo { font: 900 30px/1 var(--head); letter-spacing: .14em; }
  .logo span { color: var(--red); }
  .top .meta { margin-left: auto; text-align: right; font: 700 22px/1.25 var(--mono); color: var(--dim); letter-spacing: .06em; }
  .top .meta b { color: var(--ink); font-size: 30px; }

  /* основной блок: таймер */
  #main { position: absolute; left: 64px; width: 1376px; top: 240px; text-align: center; z-index: 3;
    transform-origin: 50% 0; transition: transform .7s cubic-bezier(.2,.8,.2,1), opacity .5s; }
  .kicker { font: 900 44px/1 var(--head); letter-spacing: .42em; color: var(--red); text-indent: .42em;
    text-shadow: 0 0 18px rgba(255,31,58,.75), 0 0 46px rgba(255,31,58,.4); }
  #timer { font: 800 250px/1 var(--mono); letter-spacing: -.02em; margin: 34px 0 30px; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 2px #fff, 0 0 40px rgba(255,31,58,.55), 0 0 110px rgba(255,31,58,.35); white-space: nowrap; }
  #timer.long { font-size: 170px; margin: 46px 0 40px; }
  #timer .d { font-size: .42em; color: var(--red); margin-right: .25em; vertical-align: .55em; }
  .sub { font: 700 40px/1.2 var(--head); letter-spacing: .2em; }
  #pause { display: none; margin-top: 26px; font: 800 26px var(--head); letter-spacing: .3em; color: #111; background: #f5b301; padding: 8px 22px; border-radius: 6px; }
  body.paused #pause { display: inline-block; }

  /* QR — всегда на белой подложке */
  #qr { position: absolute; right: 64px; top: 230px; width: 380px; z-index: 4; background: #fff; color: #0a0a0a;
    border-radius: 26px; padding: 26px 26px 24px; text-align: center; box-shadow: 0 0 0 6px rgba(255,31,58,.9), 0 30px 80px rgba(0,0,0,.6);
    transition: opacity .5s, transform .5s; }
  #qr .scan { font: 800 18px var(--head); letter-spacing: .3em; color: var(--red); margin-bottom: 14px; }
  #qr canvas { width: 328px; height: 328px; display: block; margin: 0 auto; image-rendering: pixelated; }
  #qr .cap { font: 800 25px/1.18 var(--head); margin-top: 16px; letter-spacing: .01em; }
  #qr .url { font: 700 15px var(--mono); color: #555; margin-top: 10px; word-break: break-all; }

  /* срочные объявления */
  #news { position: absolute; left: 64px; width: 1376px; bottom: 138px; z-index: 3; display: flex; align-items: stretch; transition: opacity .5s; }
  #news .tag { background: var(--red); color: #fff; font: 900 26px/1 var(--head); letter-spacing: .1em; padding: 22px 22px; display: flex; align-items: center; white-space: nowrap; }
  #news .txt { flex: 1; background: rgba(244,241,234,.96); color: #0b0b0b; font: 800 36px/1.2 var(--sans); padding: 18px 28px; display: flex; align-items: center; min-height: 92px; }
  #news .txt.swap { animation: swap .6s ease; }
  @keyframes swap { 0% { clip-path: inset(0 100% 0 0); } 100% { clip-path: inset(0 0 0 0); } }

  /* бегущая строка */
  #ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; z-index: 5; display: flex; background: #000; border-top: 3px solid var(--red); transition: opacity .5s; }
  #ticker .lab { background: var(--red); color: #fff; font: 900 28px/84px var(--head); padding: 0 34px; letter-spacing: .1em; z-index: 1; }
  #ticker .win { flex: 1; overflow: hidden; position: relative; }
  #ticker .run { position: absolute; white-space: nowrap; font: 800 32px/84px var(--mono); letter-spacing: .04em; will-change: transform; animation: run linear infinite; }
  #ticker .run span::after { content: '  ✦  '; color: var(--red); }
  @keyframes run { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* карточка гостя */
  #card { position: absolute; left: 64px; width: 1376px; top: 300px; height: 640px; z-index: 6; display: none; flex-direction: column;
    background: linear-gradient(180deg, rgba(20,8,10,.97), rgba(8,6,7,.97)); border: 3px solid var(--red);
    box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset, 0 0 80px rgba(255,31,58,.35), 0 40px 120px rgba(0,0,0,.7); }
  body.card-on #card { display: flex; }
  #card.in { animation: cardIn .55s cubic-bezier(.2,.8,.2,1) both; }
  #card.out { animation: tvOff .38s ease-in both; }
  @keyframes cardIn {
    0% { opacity: 0; clip-path: inset(49% 0 49% 0); transform: translateX(-30px) skewX(-8deg); }
    25% { opacity: 1; clip-path: inset(30% 0 52% 0); transform: translateX(22px) skewX(6deg); }
    45% { clip-path: inset(0 0 0 0); transform: translateX(-10px) skewX(-2deg); }
    65% { transform: translateX(5px); }
    100% { opacity: 1; clip-path: inset(0 0 0 0); transform: none; }
  }
  @keyframes tvOff {
    0% { transform: none; opacity: 1; }
    55% { transform: scale(1, .012); opacity: 1; filter: brightness(3); }
    100% { transform: scale(0, .012); opacity: 0; }
  }
  .c-head { display: flex; align-items: center; gap: 22px; background: var(--red); color: #fff; padding: 0 30px; height: 92px; flex: none; }
  .c-tag { font: 800 20px var(--mono); letter-spacing: .25em; opacity: .85; white-space: nowrap; }
  .c-rubric { font: 900 40px/1 var(--head); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-excl { margin-left: auto; font: 800 20px var(--mono); letter-spacing: .2em; background: #000; padding: 9px 14px; white-space: nowrap; }
  .c-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 30px 48px 34px; gap: 16px; }
  .c-lead { font: 700 32px/1.25 var(--sans); color: #cfc8bf; flex: none; }
  .c-name { font: 900 96px/1.04 var(--head); flex: none; max-height: 210px; overflow: hidden; word-break: break-word; text-shadow: 4px 4px 0 var(--blood); }
  .c-answer { flex: 1; min-height: 0; overflow: hidden; font: 800 64px/1.15 var(--sans); word-break: break-word; white-space: pre-wrap; display: flex; align-items: center; }
  .c-answer span { display: block; width: 100%; }
  .c-comment { flex: none; font: 700 36px/1.25 var(--sans); color: #fff; border-left: 8px solid var(--red); padding: 6px 0 6px 24px; }
  #card[data-layout="album"] .c-answer, #card[data-layout="big"] .c-answer, #card[data-layout="editorial"] .c-answer { font-family: var(--head); font-weight: 900; color: #fff; }
  #card[data-layout="album"] .c-answer span { color: var(--red); text-shadow: 0 0 30px rgba(255,31,58,.45); }
  #card[data-layout="editorial"] .c-answer { text-align: left; }

  /* при карточке таймер уходит наверх, но остаётся виден */
  body.card-on #main { transform: translateY(-138px) scale(.36); }
  body.card-on #main .sub, body.card-on #news { opacity: 0; }

  #flash { position: absolute; inset: 0; background: var(--red); opacity: 0; z-index: 9; pointer-events: none; mix-blend-mode: screen; }
  #flash.go { animation: flash .42s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 18% { opacity: .55; } 100% { opacity: 0; } }

  /* glitch логотипа */
  .glitch { position: relative; display: inline-block; }
  .glitch::before, .glitch::after { content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%; opacity: 0; }
  .glitch::before { color: #0ff; animation: gl1 7s infinite steps(1); }
  .glitch::after { color: var(--red); animation: gl2 7s infinite steps(1); }
  @keyframes gl1 { 0%, 91%, 100% { opacity: 0; transform: none; } 92% { opacity: .7; transform: translate(-6px, 2px); clip-path: inset(10% 0 60% 0); } 94% { opacity: .7; transform: translate(5px, -2px); clip-path: inset(60% 0 8% 0); } }
  @keyframes gl2 { 0%, 92%, 100% { opacity: 0; transform: none; } 93% { opacity: .8; transform: translate(6px, -1px); clip-path: inset(40% 0 30% 0); } 95% { opacity: .8; transform: translate(-4px, 3px); clip-path: inset(0 0 75% 0); } }

  /* финальные две минуты */
  body.view-final #qr, body.view-final #news, body.view-final #ticker, body.view-final #card,
  body.view-timer #qr, body.view-timer #news, body.view-timer #ticker { opacity: 0; pointer-events: none; }
  body.view-final #card, body.view-timer #card { display: none !important; }
  body.view-final #main { left: 0; width: 1920px; top: 250px; transform: none; }
  body.view-final #timer { font-size: 330px; color: #fff; animation: beat 1s ease-in-out infinite; }
  body.view-timer #main { left: 0; width: 1920px; top: 280px; transform: none; }
  body.view-timer #timer { font-size: 300px; }
  @keyframes beat { 0%, 100% { text-shadow: 0 0 2px #fff, 0 0 40px rgba(255,31,58,.6), 0 0 120px rgba(255,31,58,.4); } 50% { text-shadow: 0 0 2px #fff, 0 0 70px rgba(255,31,58,.95), 0 0 200px rgba(255,31,58,.7); } }
  #tension { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 1s;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(176,8,29,.55) 100%); }
  body.view-final #tension { opacity: 1; animation: tension 2s ease-in-out infinite; }
  @keyframes tension { 50% { opacity: .55; } }
  #tension::after { content: ''; position: absolute; left: 0; right: 0; height: 6px; background: var(--red); box-shadow: 0 0 40px var(--red); top: 0; animation: sweep 3s linear infinite; }
  @keyframes sweep { to { transform: translateY(1080px); } }

  /* последние 10 секунд */
  #count { position: absolute; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center; background: rgba(5,3,4,.92); }
  body.last10 #count { display: flex; }
  body.last10 #main { opacity: 0; }
  #count b { font: 900 760px/1 var(--head); color: var(--red); -webkit-text-stroke: 6px #fff; text-shadow: 0 0 120px rgba(255,31,58,.9); }
  #count b.pop { animation: pop .9s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { 0% { transform: scale(1.6); opacity: 0; filter: blur(8px); } 25% { transform: scale(1); opacity: 1; filter: none; } 85% { opacity: 1; } 100% { transform: scale(.92); opacity: .2; } }

  /* заставки: открытие и THE SHOW BEGINS */
  #splash { position: absolute; inset: 0; z-index: 10; background: #000; display: none; align-items: center; justify-content: center; flex-direction: column; text-align: center; }
  body.view-opening #splash, body.view-begins #splash { display: flex; }
  #splash .l1 { font: 900 132px/1.05 var(--head); letter-spacing: .02em; padding: 0 80px; }
  #splash .l2 { font: 700 30px var(--mono); letter-spacing: .5em; color: var(--red); margin-top: 40px; text-indent: .5em; }
  #splash .l1.red { color: var(--red); text-shadow: 0 0 60px rgba(255,31,58,.7); }
  #splash .step { animation: stepIn 1.1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes stepIn { 0% { opacity: 0; letter-spacing: .4em; filter: blur(14px); } 100% { opacity: 1; filter: none; } }
  #splash video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }

  /* сервисное: связь, кнопки (видны только при движении мыши) */
  #conn { position: absolute; right: 64px; top: 108px; z-index: 7; font: 700 18px var(--mono); color: #f5b301; display: none; letter-spacing: .08em; }
  body.offline #conn { display: block; }
  #ctl { position: fixed; right: 16px; top: 16px; z-index: 50; display: flex; gap: 8px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  body.mouse #ctl { opacity: 1; pointer-events: auto; }
  #ctl button { font: 700 14px system-ui; border: 0; border-radius: 99px; padding: 10px 16px; background: rgba(255,255,255,.92); cursor: pointer; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg"><i></i><i></i></div>

  <header class="top">
    <div class="live"><b></b>LIVE</div>
    <div class="logo glitch" data-text="ANTOSHKAALLEN TV">ANTOSHKAALLEN <span>TV</span></div>
    <div class="meta"><div id="date">03.12.2026 · ШОУ 19:55 МСК</div><b id="clock">--:--</b> МСК</div>
  </header>
  <div id="conn">● НЕТ СВЯЗИ — ПЕРЕПОДКЛЮЧАЕМСЯ</div>

  <section id="main">
    <div class="kicker">ANTOSHKAALLEN TV</div>
    <div id="timer">--:--:--</div>
    <div class="sub">ДО НАЧАЛА ВЕЧЕРА ВЫСОКОЙ КУЛЬТУРЫ</div>
    <div id="pause">⏸ ПАУЗА</div>
  </section>

  <aside id="qr">
    <div class="scan">СКАНИРУЙ</div>
    <canvas id="qrc" width="656" height="656"></canvas>
    <div class="cap">ПРОЙДИ ЭКЗАМЕН НА ДОПУСК К ПРЕМЬЕРЕ 🔞</div>
  </aside>

  <div id="news"><div class="tag">BREAKING NEWS</div><div class="txt" id="news-txt"></div></div>

  <div id="ticker"><div class="lab">СРОЧНО</div><div class="win"><div class="run" id="run"></div></div></div>

  <div id="card" data-layout="choice">
    <div class="c-head"><span class="c-tag">СВЕТСКАЯ ХРОНИКА</span><span class="c-rubric" id="c-rubric"></span><span class="c-excl">● ЭКСКЛЮЗИВ</span></div>
    <div class="c-body">
      <div class="c-lead" id="c-lead"></div>
      <div class="c-name" id="c-name"></div>
      <div class="c-answer" id="c-answer"><span></span></div>
      <div class="c-comment" id="c-comment"></div>
    </div>
  </div>

  <div id="tension"></div>
  <div id="count"><b id="count-n"></b></div>
  <div id="splash"></div>
  <div id="flash"></div>
</div>

<div id="ctl"><button id="b-fs">⛶ На весь экран</button><button id="b-qr">⬇ QR-код PNG</button></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="tv-content.js"></script>
<script>
(function () {
  'use strict';
  const API = window.QuizAPI, C = window.TV_CONTENT;
  const $ = (id) => document.getElementById(id);
  const MSK = 'Europe/Moscow';
  const FREE = { 2: 1, 6: 1, 8: 1, 10: 1, 14: 1, 15: 1 };

  // ---------- масштаб сцены 1920×1080 ----------
  const stage = $('stage');
  function fitStage() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
  }
  addEventListener('resize', fitStage); fitStage();

  // ---------- серверное время ----------
  let offset = 0;            // серверное − локальное
  const samples = [];
  const now = () => Date.now() + offset;
  function addSample(serverNow, t0, t1) {
    samples.push({ rtt: t1 - t0, off: serverNow - (t0 + t1) / 2 });
    if (samples.length > 12) samples.shift();
    offset = samples.reduce((a, b) => (b.rtt < a.rtt ? b : a)).off;  // самая быстрая выборка — самая точная
  }

  // ---------- состояние ----------
  let tv = null, feed = [], lastCmdSeq = null, lastModeSeq = null, openingAt = 0, zeroSeq = null;
  let failSince = 0, pollDelay = 5000;

  async function poll() {
    const t0 = Date.now();
    try {
      const r = await API.call({ action: 'tv_state' });
      addSample(r.now, t0, Date.now());
      if (Array.isArray(r.feed)) feed = r.feed;
      applyState(r.tv);
      failSince = 0; pollDelay = 5000; document.body.classList.remove('offline');
    } catch (e) {
      if (!failSince) failSince = Date.now();
      if (Date.now() - failSince > 12000) document.body.classList.add('offline');
      pollDelay = Math.min(pollDelay * 1.5, 20000);
    }
    setTimeout(poll, pollDelay);
  }

  function applyState(s) {
    const first = !tv;
    const prev = tv; tv = s;
    if (first) {
      lastCmdSeq = s.cmd ? s.cmd.seq : 0;
      lastModeSeq = s.modeSeq;
      if (s.mode === 'opening') openingAt = Date.now() - 60000; // перезагрузка во время открытия — сразу к финалу
    } else {
      if (s.modeSeq !== lastModeSeq) {
        lastModeSeq = s.modeSeq;
        if (s.mode === 'opening') startOpening();
      }
      if (s.cmd && s.cmd.seq !== lastCmdSeq) {
        lastCmdSeq = s.cmd.seq;
        if (s.cmd.type === 'next') showNext(true);
        if (s.cmd.type === 'hide') hideCard();
      }
      if (prev && (prev.interval !== s.interval) && !cardOn) scheduleNext();
    }
    updateQR();
    updateDateLine();
  }

  // ---------- форматирование ----------
  const p2 = (n) => String(n).padStart(2, '0');
  function fmtLeft(ms) {
    const t = Math.max(0, Math.ceil(ms / 1000));
    const d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    return (d ? `<span class="d">${d} ДН</span>` : '') + `${p2(h)}:${p2(m)}:${p2(s)}`;
  }
  const mskFmt = new Intl.DateTimeFormat('ru-RU', { timeZone: MSK, hour: '2-digit', minute: '2-digit' });
  const mskDate = new Intl.DateTimeFormat('ru-RU', { timeZone: MSK, day: '2-digit', month: '2-digit', year: 'numeric' });
  function updateDateLine() {
    if (!tv) return;
    $('date').textContent = `${mskDate.format(tv.startAt)} · ШОУ ${mskFmt.format(tv.startAt)} МСК`;
  }

  // ---------- главный цикл отрисовки ----------
  let view = '', lastTimer = '', lastDigit = null;
  function left() { return tv ? (tv.paused ? tv.pausedLeft : tv.startAt - now()) : null; }

  function computeView(rem) {
    if (tv.mode === 'opening') return 'opening';
    if (rem <= 0) {
      if (zeroSeq === null) zeroSeq = tv.modeSeq;
      if (!(tv.mode === 'main' && tv.modeSeq !== zeroSeq)) return 'begins';
      return 'main';
    }
    zeroSeq = null;
    if (tv.mode === 'final' || rem <= 120000) return 'final';
    if (tv.mode === 'timer_only') return 'timer';
    return 'main';
  }

  function frame() {
    $('clock').textContent = mskFmt.format(now());
    if (!tv) return;
    const rem = left();
    const v = computeView(rem);
    if (v !== view) setView(v);
    document.body.classList.toggle('paused', !!tv.paused);

    const t = fmtLeft(rem);
    if (t !== lastTimer) { $('timer').innerHTML = t; lastTimer = t; }
    $('timer').classList.toggle('long', rem >= 86400000);

    const last10 = v === 'final' && rem > 0 && rem <= 10000;
    document.body.classList.toggle('last10', last10);
    if (last10) {
      const d = Math.ceil(rem / 1000);
      if (d !== lastDigit) {
        lastDigit = d;
        const b = $('count-n'); b.textContent = d; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
      }
    } else lastDigit = null;

    if (v === 'opening') runOpening();

    // автопоказ карточек
    if (v === 'main' && tv.autoplay && !cardOn && Date.now() >= nextCardAt) showNext(false);
  }
  setInterval(frame, 200);

  function setView(v) {
    const was = view; view = v;
    document.body.classList.remove('view-main', 'view-final', 'view-timer', 'view-opening', 'view-begins');
    document.body.classList.add('view-' + v);
    if (v !== 'main' && cardOn) hideCard(true);
    if (v === 'begins') showBegins();
    if (v === 'main' && was && was !== 'main') scheduleNext();
  }

  // ---------- заставки ----------
  const splash = $('splash');
  let splashStep = -1;
  function startOpening() { openingAt = Date.now(); splashStep = -1; }
  function runOpening() {
    if (C.openingVideo) {
      if (splashStep !== 99) {
        splashStep = 99; splash.innerHTML = '';
        const vEl = document.createElement('video');
        vEl.src = C.openingVideo; vEl.muted = true; vEl.playsInline = true; vEl.autoplay = true;
        vEl.onended = vEl.onerror = () => { splashStep = 2; showBegins(); };
        splash.appendChild(vEl);
        vEl.play().catch(() => { splashStep = 2; showBegins(); });
      }
      return;
    }
    const t = Date.now() - openingAt;
    const step = t < 4200 ? 0 : t < 8800 ? 1 : 2;
    if (step === splashStep) return;
    splashStep = step;
    if (step === 0) splashSet('ANTOSHKAALLEN PRESENTS', '', false);
    if (step === 1) splashSet('ВЕЧЕР ВЫСОКОЙ КУЛЬТУРЫ', '🔞 ПРЕМЬЕРА АЛЬБОМА', false);
    if (step === 2) showBegins();
  }
  function splashSet(l1, l2, red) {
    splash.innerHTML = '';
    const a = document.createElement('div'); a.className = 'l1 step' + (red ? ' red' : ''); a.textContent = l1;
    splash.appendChild(a);
    if (l2) { const b = document.createElement('div'); b.className = 'l2 step'; b.style.animationDelay = '.5s'; b.textContent = l2; splash.appendChild(b); }
    flash();
  }
  function showBegins() { splashSet('THE SHOW BEGINS', 'ANTOSHKAALLEN TV · LIVE', true); }

  // ---------- QR ----------
  let qrUrl = '';
  function quizUrl() { return (tv && tv.quizUrl) || new URL('./', location.href).href; }
  function drawQR(canvas, url, size, margin) {
    if (!window.qrcode) return false;
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    const n = qr.getModuleCount(), cell = Math.floor((size - margin * 2) / n), off = Math.floor((size - cell * n) / 2);
    canvas.width = size; canvas.height = size;
    const g = canvas.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, size, size); g.fillStyle = '#000';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) g.fillRect(off + c * cell, off + r * cell, cell, cell);
    return true;
  }
  function updateQR() {
    const u = quizUrl();
    if (u === qrUrl && window.qrcode) return;
    if (drawQR($('qrc'), u, 656, 16)) qrUrl = u;
  }
  function loadQRLib(srcs) {
    if (!srcs.length) return;
    const s = document.createElement('script'); s.src = srcs[0];
    s.onload = () => { qrUrl = ''; updateQR(); };
    s.onerror = () => loadQRLib(srcs.slice(1));
    document.head.appendChild(s);
  }
  loadQRLib(['https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js', 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js', 'qrcode.min.js']);
  $('b-qr').onclick = () => {
    const c = document.createElement('canvas');
    if (!drawQR(c, quizUrl(), 1600, 120)) return;
    const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = 'antoshkaallen-quiz-qr.png'; a.click();
  };
  $('b-fs').onclick = () => { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}); };

  // ---------- объявления и бегущая строка ----------
  const rnd = (n) => Math.floor(Math.random() * n);
  function pickOther(list, last) { if (list.length < 2) return 0; let i; do { i = rnd(list.length); } while (i === last); return i; }
  let newsIdx = -1;
  function rotateNews() {
    newsIdx = pickOther(C.editorial, newsIdx);
    const el = $('news-txt'); el.textContent = C.editorial[newsIdx];
    el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
  }
  rotateNews(); setInterval(rotateNews, 11000);

  (function ticker() {
    const run = $('run');
    const items = C.ticker.slice().sort(() => Math.random() - .5);
    const html = items.map(t => { const s = document.createElement('span'); s.textContent = t; return s.outerHTML; }).join('');
    run.innerHTML = html + html; // дубль для бесшовной прокрутки
    run.style.animationDuration = Math.max(40, items.join('').length * 0.22) + 's';
  })();

  // ---------- карточки гостей ----------
  let cardOn = false, cardTimer = null, nextCardAt = Date.now() + 12000;
  let lastKey = '', lastGuest = '', lastRubric = 0, edIdx = -1;
  const lastComment = {};
  const SHOWN_KEY = 'tv_shown_v1';
  let shown = (() => { try { return JSON.parse(localStorage.getItem(SHOWN_KEY)) || { c: {}, g: {} }; } catch (e) { return { c: {}, g: {} }; } })();
  function saveShown() { try { localStorage.setItem(SHOWN_KEY, JSON.stringify(shown)); } catch (e) {} }

  function scheduleNext() {
    const base = (tv ? tv.interval : 50) * 1000;
    nextCardAt = Date.now() + base * (0.8 + Math.random() * 0.4);   // 40–60 с при интервале 50
  }

  function priority(a) {
    if (a.q === 8 || a.q === 10 || a.q === 14 || a.q === 15) return 3;
    if (a.q === 6) return a.t.trim().length >= 3 ? 3 : 1;
    if (FREE[a.q] || a.q === 5 || a.q === 9) return 2;
    return 1;
  }

  function pickCard() {
    const guests = new Set(feed.map(a => a.g));
    let best = null, bestW = 0, fresh = 0;
    for (const a of feed) {
      const r = C.rubrics[a.q]; if (!r) continue;
      const key = a.g + '|' + a.q;
      const cs = shown.c[key] || 0, gs = shown.g[a.g] || 0;
      if (cs > 0 && !tv.allowRepeat) continue;
      if (key === lastKey) continue;
      if (a.g === lastGuest && guests.size > 1) continue;
      if (cs === 0) fresh++;
      let w = priority(a);
      if (tv.priorityNew && gs === 0) w += 3;
      w = w / (1 + 2 * cs) / (1 + 1.5 * gs);
      if (a.q === lastRubric) w *= 0.6;
      w *= 0.7 + Math.random() * 0.6;  // немного случайности
      if (w > bestW) { bestW = w; best = a; }
    }
    // если свежих карточек нет — иногда разбавляем заявлениями редакции
    if (best && fresh === 0 && Math.random() < 0.35) return null;
    return best;
  }

  function fill(name, s, a) { return s.replace(/\{name\}/g, name || 'Гость'); }

  function showNext(manual) {
    if (!tv) return;
    if (cardOn) hideCard(true);
    const a = pickCard();
    if (a) showGuest(a); else showEditorial();
  }

  function showGuest(a) {
    const r = C.rubrics[a.q];
    let pool = [], comment = '';
    if (r.layout === 'choice') pool = (r.comments && r.comments[a.o]) || [];
    else if (r.comments) pool = r.comments;
    if (pool.length) {
      const k = a.q + a.o;
      const i = pickOther(pool, lastComment[k]); lastComment[k] = i;
      comment = fill(a.n, pool[i]);
    }
    const layout = r.layout;
    let lead = r.lead ? fill(a.n, r.lead) : '', name = a.n, answer = a.t;
    if (layout === 'choice') answer = '«' + a.t.replace(/\.$/, '') + '»';
    if (layout === 'quote' || layout === 'big') answer = '«' + a.t + '»';
    if (layout === 'album') { name = ''; comment = r.footer; answer = '«' + a.t + '»'; }
    render(layout, r.title, lead, name, answer, comment);

    const key = a.g + '|' + a.q;
    shown.c[key] = (shown.c[key] || 0) + 1; shown.g[a.g] = (shown.g[a.g] || 0) + 1; saveShown();
    lastKey = key; lastGuest = a.g; lastRubric = a.q;
  }

  function showEditorial() {
    edIdx = pickOther(C.editorial, edIdx);
    render('editorial', '📢 ЗАЯВЛЕНИЕ РЕДАКЦИИ', '', '', C.editorial[edIdx], '');
    lastKey = ''; lastRubric = 0;
  }

  function render(layout, rubric, lead, name, answer, comment) {
    const card = $('card');
    card.dataset.layout = layout;
    $('c-rubric').textContent = rubric;
    setText('c-lead', lead); setText('c-name', name); setText('c-comment', comment);
    $('c-answer').firstChild.textContent = answer;     // только textContent: ответы гостей не исполняются как HTML
    card.classList.remove('out', 'in');
    document.body.classList.add('card-on'); cardOn = true;
    // подгонка размеров: длинные ответы уменьшаем, но не обрезаем
    fitHeight($('c-name'), 104, 52);
    const big = layout === 'album' ? 150 : layout === 'big' || layout === 'editorial' ? 112 : 66;
    fitHeight($('c-answer'), big, 26, true);
    void card.offsetWidth; card.classList.add('in'); flash();
    clearTimeout(cardTimer);
    cardTimer = setTimeout(() => hideCard(), (tv ? tv.duration : 6) * 1000);
  }
  function setText(id, t) { const el = $(id); el.textContent = t; el.style.display = t ? '' : 'none'; }

  function fitHeight(el, max, min, inner) {
    if (el.style.display === 'none') return;
    let size = max;
    const target = inner ? el.firstChild : el;
    target.style.fontSize = size + 'px';
    while (size > min && (inner ? target.scrollHeight > el.clientHeight : el.scrollHeight > el.clientHeight + 2)) {
      size -= 4; target.style.fontSize = size + 'px';
    }
  }

  function hideCard(instant) {
    if (!cardOn) return;
    clearTimeout(cardTimer);
    const card = $('card');
    const done = () => { card.classList.remove('out', 'in'); document.body.classList.remove('card-on'); cardOn = false; scheduleNext(); };
    if (instant) return done();
    card.classList.remove('in'); void card.offsetWidth; card.classList.add('out');
    setTimeout(done, 380);
  }

  function flash() { const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }

  // ---------- мышь и клавиши ----------
  let mouseT;
  addEventListener('mousemove', () => { document.body.classList.add('mouse'); clearTimeout(mouseT); mouseT = setTimeout(() => document.body.classList.remove('mouse'), 2500); });
  addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'а') $('b-fs').click(); });

  poll();
})();
</script>
</body>
