<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0b">
<title>Протокол организатора</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Spray+Paint&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0b; --card:#141315; --ink:#f1ede4; --dim:#8f8a80; --line:rgba(241,237,228,.14); --red:#ff2b3d; --green:#3ddc84; --gold:#f5b301;
    --graffiti:'Rubik Spray Paint',Impact,sans-serif; --serif:'Cormorant Garamond',Georgia,serif; --sans:'Manrope',system-ui,sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 var(--sans); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 18px 16px 60px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:14px; }
  h1 { font-family:var(--graffiti); font-weight:400; font-size:30px; margin:0; text-shadow:2px 2px 0 #b5121f; }
  .muted { color:var(--dim); font-size:13px; }
  button, select, input { font: 600 14px var(--sans); }
  .btn { background:var(--ink); color:var(--bg); border:0; border-radius:99px; padding:9px 14px; cursor:pointer; }
  .btn.red { background:var(--red); color:#fff; }
  .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .stat b { display:block; font-family:var(--serif); font-size:34px; line-height:1; }
  .stat span { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }

  .tabs { display:flex; gap:6px; margin: 6px 0 14px; overflow-x:auto; }
  .tab { background:transparent; color:var(--dim); border:1px solid var(--line); border-radius:99px; padding:8px 14px; cursor:pointer; white-space:nowrap; }
  .tab.on { background:var(--red); color:#fff; border-color:var(--red); }

  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); font-weight:600; padding:8px; border-bottom:1px solid var(--line); }
  td { padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .place { font-family:var(--graffiti); font-size:22px; width:44px; }
  .p1 .place { color:var(--gold); } .p2 .place { color:#d8d8d8; } .p3 .place { color:#cd7f32; }
  .score { font-family:var(--serif); font-size:26px; font-weight:600; }
  .pill { font-size:11px; padding:3px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  .pill.ok { color:var(--green); border-color:rgba(61,220,132,.4); }

  .bonus { display:inline-flex; gap:4px; }
  .bonus button { min-width:36px; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
  .bonus button.plus { border-color:rgba(255,43,61,.5); color:#ff6b78; }
  .bonus button:active { transform:scale(.95); }
  .bonus button:disabled { opacity:.4; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .card > summary { list-style:none; cursor:pointer; padding:14px; display:flex; gap:10px; align-items:center; justify-content:space-between; }
  .card > summary::-webkit-details-marker { display:none; }
  .card .name { font-weight:800; font-size:16px; }
  .ans { padding:12px 14px; border-top:1px solid var(--line); display:grid; grid-template-columns: 1fr auto; gap:6px 12px; align-items:center; }
  .ans .qq { font-size:12px; color:var(--dim); grid-column:1 / -1; }
  .ans .val { font-family:var(--serif); font-size:20px; line-height:1.25; word-break:break-word; }
  .ans .pts { font-size:12px; color:var(--dim); }
  .ans .pts b { color:var(--ink); }
  .ans.free .val { color:#fff; }
  .ans.free .qq::after { content:' · свободный'; color:var(--gold); }

  .login { max-width:360px; margin:15vh auto 0; text-align:center; }
  .login input { width:100%; background:transparent; border:0; border-bottom:2px solid var(--ink); color:var(--ink); font-size:20px; padding:10px 0; outline:none; text-align:center; margin:18px 0; }
  .err { color:var(--red); min-height:20px; font-size:13px; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:99px; font-weight:600; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; }
  .toast.show { opacity:1; }
  @media (max-width: 640px) {
    .hide-sm { display:none; }
    td, th { padding:8px 4px; }
    .stat b { font-size:26px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="admin-tv.js"></script>
<script>
(function () {
  const Q = window.QUIZ, API = window.QuizAPI, total = Q.questions.length;
  const KEY_STORE = 'quiz_admin_key';
  const app = document.getElementById('app');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  let key = localStorage.getItem(KEY_STORE) || '';
  let data = [], tab = 'rating', qFilter = firstFreeQ(), openIds = new Set(), timer = null, busy = false;

  function firstFreeQ() { const i = Q.questions.findIndex(q => q.type === 'text'); return i >= 0 ? i + 1 : 1; }
  function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1600); }

  // ---------- вход ----------
  function renderLogin(err) {
    clearInterval(timer);
    app.innerHTML = `
      <div class="login">
        <h1>Протокол</h1>
        <div class="muted">Панель организатора. Введите ключ из Code.gs${API.DEMO ? ' (в демо-режиме: <b>demo</b>)' : ''}.</div>
        <input type="password" id="k" placeholder="Ключ организатора" autocomplete="current-password">
        <div class="err">${esc(err || '')}</div>
        <button class="btn red" id="go">Войти</button>
      </div>`;
    const k = document.getElementById('k');
    k.focus();
    const go = () => { key = k.value.trim(); load(true); };
    document.getElementById('go').onclick = go;
    k.onkeydown = (e) => { if (e.key === 'Enter') go(); };
  }

  // ---------- данные ----------
  async function load(first) {
    if (busy) return; busy = true;
    try {
      const res = await API.call({ action: 'admin_list', key });
      localStorage.setItem(KEY_STORE, key);
      data = res.participants;
      if (first || !app.querySelector('.stats')) renderShell();
      renderBody();
    } catch (e) {
      if (e.message === 'wrong_key') { localStorage.removeItem(KEY_STORE); renderLogin('Неверный ключ'); }
      else if (first) renderLogin('Не удалось связаться с сервером: ' + e.message);
      else toast('Нет связи с сервером, повторим…');
    } finally { busy = false; }
  }

  async function bonus(id, q, delta, btn) {
    if (btn) btn.disabled = true;
    try {
      const res = await API.call({ action: 'admin_bonus', key, id, q, delta });
      data = res.participants; renderBody();
      toast((delta > 0 ? '+' : '') + delta + ' балл(а) начислено');
    } catch (e) { toast('Ошибка: ' + e.message); if (btn) btn.disabled = false; }
  }

  // ---------- каркас ----------
  function renderShell() {
    app.innerHTML = `
      <header>
        <div><h1>Протокол вечера</h1><div class="muted" id="upd"></div></div>
        <div class="row">
          <button class="btn ghost" id="refresh">↻ Обновить</button>
          <button class="btn ghost" id="csv">CSV</button>
          <button class="btn" id="xlsx">Excel</button>
          <button class="btn ghost" id="out">Выйти</button>
        </div>
      </header>
      ${API.DEMO ? '<p class="muted" style="color:var(--gold)">ДЕМО-РЕЖИМ: показаны данные только из этого браузера. <a href="index.html" style="color:var(--gold)">← к квизу</a></p>' : ''}
      <div class="stats">
        <div class="stat"><b id="st-p">0</b><span>участников</span></div>
        <div class="stat"><b id="st-f">0</b><span>завершили</span></div>
        <div class="stat"><b id="st-a">0</b><span>ответов</span></div>
      </div>
      <div class="tabs">
        <button class="tab" data-tab="rating">🏆 Рейтинг</button>
        <button class="tab" data-tab="byq">✍️ По вопросам</button>
        <button class="tab" data-tab="people">👥 Участники</button>
        <button class="tab" data-tab="tv">🎛️ ANTOSHKAALLEN TV</button>
      </div>
      <div id="body"></div>`;
    document.getElementById('refresh').onclick = () => load();
    document.getElementById('csv').onclick = exportCSV;
    document.getElementById('xlsx').onclick = exportXLSX;
    document.getElementById('out').onclick = () => { localStorage.removeItem(KEY_STORE); key = ''; renderLogin(); };
    app.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderBody(); });
    clearInterval(timer);
    timer = setInterval(() => { if (!document.hidden) load(); }, 10000);
  }

  function sorted() {
    return data.slice().sort((a, b) => b.score - a.score || Object.keys(b.answers).length - Object.keys(a.answers).length || String(a.started).localeCompare(String(b.started)));
  }
  function answered(p) { return Object.keys(p.answers).length; }
  function bonusBtns(id, q) {
    return `<span class="bonus" data-id="${esc(id)}" data-q="${q}">
      <button data-d="-1">−1</button><button class="plus" data-d="1">+1</button><button class="plus" data-d="3">+3</button><button class="plus" data-d="5">+5</button></span>`;
  }

  function renderBody() {
    const body = document.getElementById('body'); if (!body) return;
    app.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    document.getElementById('st-p').textContent = data.length;
    document.getElementById('st-f').textContent = data.filter(p => p.finished).length;
    document.getElementById('st-a').textContent = data.reduce((s, p) => s + answered(p), 0);
    document.getElementById('upd').textContent = 'обновлено ' + new Date().toLocaleTimeString('ru-RU') + ' · автообновление каждые 10 сек';

    if (tab === 'tv') { if (window.AdminTV) AdminTV.mount(body, { key, API }); return; }

    if (!data.length) { body.innerHTML = '<p class="muted">Пока никто не пришёл. Гости появятся здесь, как только введут имя.</p>'; return; }

    if (tab === 'rating') {
      body.innerHTML = `<table>
        <thead><tr><th>#</th><th>Имя</th><th>Баллы</th><th class="hide-sm">Ответов</th><th class="hide-sm">Статус</th><th>Общий бонус</th></tr></thead>
        <tbody>${sorted().map((p, i) => `
          <tr class="p${i + 1}">
            <td class="place">${i + 1}</td>
            <td><b>${esc(p.name)}</b>${p.bonus ? `<div class="muted">бонус: ${p.bonus > 0 ? '+' : ''}${p.bonus}</div>` : ''}</td>
            <td class="score">${p.score}</td>
            <td class="hide-sm">${answered(p)} / ${total}</td>
            <td class="hide-sm">${p.finished ? '<span class="pill ok">сдал(а)</span>' : '<span class="pill">в процессе</span>'}</td>
            <td>${bonusBtns(p.id, 0)}</td>
          </tr>`).join('')}</tbody></table>`;
    }

    if (tab === 'byq') {
      const opts = Q.questions.map((q, i) => `<option value="${i + 1}" ${qFilter === i + 1 ? 'selected' : ''}>${i + 1}. ${q.type === 'text' ? '✍️ ' : ''}${esc(q.text)}</option>`).join('');
      const qn = qFilter, q = Q.questions[qn - 1];
      const rows = sorted().filter(p => p.answers[qn]);
      // сводка по вариантам
      let summary = '';
      if (q.type === 'choice') {
        const cnt = {}; rows.forEach(p => { const v = p.answers[qn].value; const l = v.split('.')[0]; cnt[l] = (cnt[l] || 0) + 1; });
        summary = `<div class="row" style="margin:6px 0 12px">${q.options.map((o, k) => `<span class="pill">${window.QUIZ_LETTERS[k]} — ${cnt[window.QUIZ_LETTERS[k]] || 0}</span>`).join('')}</div>`;
      }
      body.innerHTML = `
        <select id="qsel" style="width:100%;padding:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px">${opts}</select>
        ${summary}
        <div class="muted" style="margin:8px 0">Ответили: ${rows.length} из ${data.length}. Начисляйте бонус за самые смешные ответы 👇</div>
        <div class="card">${rows.map(p => answerRow(p, p.answers[qn], true)).join('') || '<div class="ans muted">Пока нет ответов</div>'}</div>`;
      document.getElementById('qsel').onchange = (e) => { qFilter = +e.target.value; renderBody(); };
    }

    if (tab === 'people') {
      body.innerHTML = sorted().map(p => `
        <details class="card" data-id="${esc(p.id)}" ${openIds.has(p.id) ? 'open' : ''}>
          <summary>
            <div><div class="name">${esc(p.name)}</div><div class="muted">${answered(p)} / ${total} · ${p.finished ? 'сдал(а)' : 'в процессе'} · ID ${esc(p.id.slice(0, 6).toUpperCase())}</div></div>
            <div class="score">${p.score}</div>
          </summary>
          ${Q.questions.map((q, i) => p.answers[i + 1] ? answerRow(p, p.answers[i + 1], false) : `<div class="ans"><div class="qq">${i + 1}. ${esc(q.text)}</div><div class="muted">— нет ответа —</div></div>`).join('')}
        </details>`).join('');
      body.querySelectorAll('details').forEach(d => d.ontoggle = () => { d.open ? openIds.add(d.dataset.id) : openIds.delete(d.dataset.id); });
    }

    body.querySelectorAll('.bonus button').forEach(b => b.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();
      const w = b.parentElement; bonus(w.dataset.id, +w.dataset.q, +b.dataset.d, b);
    });
  }

  function answerRow(p, a, showName) {
    const q = Q.questions[a.q - 1] || {};
    return `<div class="ans ${q.type === 'text' ? 'free' : ''}">
      <div class="qq">${showName ? `<b style="color:var(--ink)">${esc(p.name)}</b>` : `${a.q}. ${esc(q.text || a.question)}`}</div>
      <div class="val">${esc(a.value)}</div>
      <div>${bonusBtns(p.id, a.q)}</div>
      <div class="pts">авто: <b>${a.auto}</b> · бонус: <b>${a.bonus > 0 ? '+' : ''}${a.bonus}</b></div>
    </div>`;
  }

  // ---------- выгрузка ----------
  function table() {
    const head = ['Место', 'Имя', 'ID', 'Баллы', 'Общий бонус', 'Ответов', 'Начал', 'Закончил'];
    Q.questions.forEach((q, i) => { head.push((i + 1) + '. ' + q.text); head.push((i + 1) + ' баллы'); });
    const rows = sorted().map((p, k) => {
      const r = [k + 1, p.name, p.id, p.score, p.bonus, answered(p), fmt(p.started), fmt(p.finished)];
      Q.questions.forEach((q, i) => { const a = p.answers[i + 1]; r.push(a ? a.value : ''); r.push(a ? a.auto + a.bonus : ''); });
      return r;
    });
    return [head].concat(rows);
  }
  function fmt(s) { if (!s) return ''; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString('ru-RU'); }
  function fname(ext) { return 'quiz-results-' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.' + ext; }
  function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

  function exportCSV() {
    const csv = table().map(r => r.map(v => { v = String(v == null ? '' : v); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';')).join('\r\n');
    download(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }), fname('csv'));
  }
  function exportXLSX() {
    const run = () => {
      const ws = XLSX.utils.aoa_to_sheet(table());
      ws['!cols'] = table()[0].map((h, i) => ({ wch: i < 8 ? 14 : (i % 2 === 0 ? 34 : 8) }));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Результаты');
      XLSX.writeFile(wb, fname('xlsx'));
    };
    if (window.XLSX) return run();
    toast('Готовим Excel…');
    const s = document.createElement('script');
    s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload = run; s.onerror = () => { toast('Excel недоступен — скачиваю CSV'); exportCSV(); };
    document.head.appendChild(s);
  }

  // ---------- старт ----------
  if (key) load(true); else renderLogin();
})();
</script>
</body>
</html>
